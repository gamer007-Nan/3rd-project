<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Retail Guard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Retail Guard</h1>
  <p class="muted">Inventory and anti-theft dashboard</p>
  <form id="login-form">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p id="msg" class="error" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const r = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json", "Accept": "application/json"}, body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Sign in failed");
    location.href = "/";
  } catch (err) { msg.textContent = err.message; }
});
</script>
</body>
</html>
